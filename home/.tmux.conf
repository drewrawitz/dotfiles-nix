# bind prefix r to reload the tmux.conf file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# remap prefix to Control + a
unbind C-b
set -g prefix C-a

# send CTRL-a to an application running within tmux simply by pressing CTRL-a twice.
bind -r C-a send-prefix

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Mode keys
set-window-option -g mode-keys vi

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# Copying
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Open a new window
bind c new-window -c "#{pane_current_path}"

# Splitting Panes
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# pane number display
set-option -g display-panes-active-colour colour20 #blue
set-option -g display-panes-colour colour196 #orange

# clock
set-window-option -g clock-mode-colour colour255
set -g clock-mode-style 12

# right side information
set -g status-right-length 100
set -g status-right "#(date '+%A, %B%e - %r') "

# Mouse
set -g mouse on

# Navigate panes with Ctrl+h/j/k/l. When the pane runs Neovim, pass the key through so
# vim-tmux-navigator (home/.config/nvim/lua/plugins/tmux-navigator.lua) can move between
# splits first and hand back to tmux at the edge.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Position
set-option -g status-position top

# Focus
set -g focus-events on

# Jump between tmux sessions
bind C-j choose-tree

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# Pinned: the @catppuccin_* options below are v0 syntax; v1+ renamed them.
set -g @plugin 'catppuccin/tmux#v0.3.0'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█"
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_justify "centre"
set -g @catppuccin_status_modules_right "null"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# To enable Yazi's image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Fresh machine: clone TPM and install the plugins above on first launch.
# install_plugins reads its target dir from this variable, which tpm itself only sets
# on the last line, so set it here or the first install has nowhere to go.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
